  services:

    # --- REVERSE PROXY ---
    npm:
      image: 'jc21/nginx-proxy-manager:latest'
      container_name: npm
      restart: unless-stopped
      ports:
        - '80:80'     
        - '443:443'   
        - '81:81'     
      volumes:
        - ./config/npm/data:/data
        - ./config/npm/letsencrypt:/etc/letsencrypt
      networks:
        edge_net:
          ipv4_address: 10.0.0.10
        apps_net:
          ipv4_address: 10.30.0.10

    # --- ADGUARD HOME ---
    adguardhome:
      image: adguard/adguardhome:latest
      container_name: adguardhome
      restart: unless-stopped
      ports:
        # Puerto DNS (TCP y UDP)
        - "53:53/tcp"
        - "53:53/udp"
        # Descomentar las siguientes líneas SOLO la primera vez para ejecutar el asistente inicial e ingresar a la interfaz web de AdGuard Home y añadir filtro *.home apuntando a la ip fija del server. Luego comentar nuevamente para evitar tener abiertos puertos innecesarios.:
        #- "3000:3000/tcp"
        #- "8080:80/tcp"
      volumes:
        - ./config/adguard/work:/opt/adguardhome/work
        - ./config/adguard/conf:/opt/adguardhome/conf
      networks:
        dns_net:
          ipv4_address: 10.20.0.10
        edge_net:

    # --- PORTAINER ---
    portainer:
      image: portainer/portainer-ce:latest
      container_name: portainer
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ./config/portainer:/data
      networks:
        apps_net:
          ipv4_address: 10.30.0.20

    # --- DOZZLE ---
    dozzle:
      image: amir20/dozzle:latest
      container_name: dozzle
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
      networks:
        apps_net:
          ipv4_address: 10.30.0.30

    samba:
      image: dperson/samba:latest
      container_name: samba
      restart: unless-stopped
      ports:
        - "139:139"
        - "445:445"
      volumes:
        - ./storage/public:/storage/public
        - ./storage/media:/storage/media
        - ./storage/users:/storage/users
      environment:
        TZ: Europe/Madrid
      command:
        - -u
        - "${SAMBA_USER};${SAMBA_PASSWORD}"
        - -s
        - "Public;/storage/public;yes;no;yes;all;none"
        - -s
        - "Media;/storage/media;yes;no;yes;all;none"
        - -s
        - "Users;/storage/users;yes;no;no;${SAMBA_USER};${SAMBA_USER}"
      networks:
        storage_net:
          ipv4_address: 10.40.0.10

  networks:
    # Reverse proxy network
    edge_net:
      driver: bridge
      ipam:
        config:
          - subnet: 10.0.0.0/24      

    # Cloudflare tunnel network
    tunnel_net:
      driver: bridge
      ipam:
        config:
          - subnet: 10.10.0.0/24

    # DNS network
    dns_net:
      driver: bridge
      ipam:
        config:
          - subnet: 10.20.0.0/24

    # Apps network
    apps_net:
      driver: bridge
      ipam:
        config:
          - subnet: 10.30.0.0/24

    # Storage network (Internal network)
    storage_net:
      driver: bridge
      ipam:
        config:
          - subnet: 10.40.0.0/24
